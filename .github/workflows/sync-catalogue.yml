name: Sync catalogue

# Pulls the full CC0 catalogue from the public MUSAI endpoint, normalises it and
# publishes it in four formats plus the genre map. Runs on demand and weekly, so no file drifts.
#
# The one correction applied here: nine styles are free-time and the source emits
# BPM 0 for them. Zero is not "no tempo", it is a false number that sinks any
# average, so it becomes an empty cell in CSV, null in JSON and a dash in Markdown.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

env:
  ENDPOINT: "https://wugjfwatnlchlrajryqs.supabase.co/functions/v1/musai-recetas-publicas"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --quiet pandas pyarrow matplotlib

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch source
        run: |
          curl -fsSL "$ENDPOINT?f=csv&limit=1000" -o raw.csv
          curl -fsSL "$ENDPOINT?f=md&limit=1000" -o raw_table.md
          test "$(wc -l < raw.csv)" -ge 500

      - name: Build all four formats
        run: |
          python3 - <<'PY'
          import csv, io, json, os
          import pandas as pd

          HDR = ["style","family","bpm","weirdness","style_influence","style_prompt","structure","url"]
          rows = list(csv.DictReader(open("raw.csv", encoding="utf-8")))
          for r in rows:
              if r["bpm"].strip() == "0":
                  r["bpm"] = ""          # free-time: no tempo, not zero
          n = len(rows)
          pulseless = sum(1 for r in rows if r["bpm"] == "")

          buf = io.StringIO()
          w = csv.DictWriter(buf, fieldnames=HDR, lineterminator="\n")
          w.writeheader()
          w.writerows({k: r[k] for k in HDR} for r in rows)
          open("styles.csv", "w", encoding="utf-8").write(buf.getvalue())

          def num(v):
              v = (v or "").strip()
              return int(v) if v.isdigit() else None

          styles = [{"style": r["style"], "family": r["family"], "bpm": num(r["bpm"]),
                     "weirdness": num(r["weirdness"]), "style_influence": num(r["style_influence"]),
                     "style_prompt": r["style_prompt"], "structure": r["structure"],
                     "url": r["url"]} for r in rows]
          doc = {"count": n, "license": "CC0-1.0",
                 "source": "https://musaisong.app/en/styles",
                 "repository": "https://github.com/samuelgrupolimex-prog/suno-style-recipes",
                 "dataset": "https://huggingface.co/datasets/musaisong/suno-style-recipes",
                 "styles": styles}
          open("styles.json", "w", encoding="utf-8").write(json.dumps(doc, ensure_ascii=False, indent=2) + "\n")

          df = pd.DataFrame(styles)
          for c in ("bpm", "weirdness", "style_influence"):
              df[c] = df[c].astype("Int64")
          df.to_parquet("styles.parquet", index=False, compression="snappy")

          table = []
          for line in open("raw_table.md", encoding="utf-8").read().split("\n"):
              if line.startswith("| ") and line.count("|") >= 8:
                  cells = line.split("|")
                  if cells[3].strip() == "0":
                      cells[3] = " - "
                  line = "|".join(cells)
              table.append(line)

          head = ("# Every documented style (" + str(n) + ")\n\n"
                  "One row per style: the style prompt, the tempo, the two Suno sliders that\n"
                  "change the result most, and a link to the full page for that style.\n\n"
                  + str(pulseless) + " styles carry no BPM at all. They are free-time, and their tempo cell\n"
                  "reads a dash rather than a zero: setting a BPM on them does not make them\n"
                  "faster, it makes them wrong.\n\n"
                  "Public domain (CC0 1.0). Copy it, fork it, ship it, no attribution required.\n"
                  "The same data as CSV, JSON and Parquet, plus a canonical song structure\n"
                  "column: [styles.csv](styles.csv) - [styles.json](styles.json) - [styles.parquet](styles.parquet).\n\n")
          open("STYLES.md", "w", encoding="utf-8").write(head + "\n".join(table))

          open(os.environ["GITHUB_ENV"], "a").write("ROWS=" + str(n) + "\n")
          print("Built " + str(n) + " styles, " + str(pulseless) + " without pulse.")
          PY
          rm -f raw.csv raw_table.md

      - name: Render genre map
        run: python3 scripts/genre_map.py

      - name: Commit
        run: |
          git add styles.csv styles.json styles.parquet STYLES.md assets/genre-map.png assets/genre-map.svg
          git diff --staged --quiet || git commit -m "Sync catalogue: $ROWS styles in CSV, JSON, Parquet and Markdown"
          git push
